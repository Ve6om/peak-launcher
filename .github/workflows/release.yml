name: Release

# Push a tag like v0.2.0 to build, sign and publish installers for every
# platform. The release stays a draft until every platform has uploaded, so
# running copies of Peak never see a half-finished latest.json. The release notes (shown in the launcher's update prompt) come
# from release-notes/<tag>.md if it exists, otherwise from the tag message.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          PKG=$(jq -r .version package.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versions (tauri.conf.json $CONF, package.json $PKG, Cargo.toml $CARGO)"
            exit 1
          fi
      - name: Read release notes
        id: notes
        run: |
          FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$FILE" ]; then
            BODY=$(cat "$FILE")
          else
            # Checkout drops annotated tag messages, so fetch the tag itself.
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            BODY=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && BODY="Bug fixes and improvements."
          echo "$BODY" > notes.md
      # One draft for every build to upload into; published at the end.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Take the id from the create call: a new draft isn't listed by tag right away.
          ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Peak Launcher $GITHUB_REF_NAME" \
            -F body=@notes.md -F draft=true --jq .id)
          [ -n "$ID" ] || { echo "::error::Couldn't create the draft release"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the build; leave unset to ship without them.
          PEAK_CF_PROXY: ${{ vars.PEAK_CF_PROXY }}
          PEAK_MS_CLIENT_ID: ${{ vars.PEAK_MS_CLIENT_ID }}
        with:
          releaseId: ${{ needs.notes.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.notes.outputs.release_id }}
        run: |
          # Every platform must be in latest.json before Peak can see it.
          ASSET=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$ASSET" ] || { echo "::error::latest.json wasn't uploaded"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" > latest.json
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p]' latest.json > /dev/null || { echo "::error::latest.json is missing $p"; exit 1; }
          done
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq .html_url

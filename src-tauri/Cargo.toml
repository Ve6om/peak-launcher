[package]
name = "peak-launcher"
version = "0.1.20"
description = "Peak Launcher - a fast, modern Minecraft launcher"
authors = ["Peak Launcher contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "peak_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
discord-rich-presence = "1.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "socks", "multipart"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
trash = "5"
arboard = { version = "3", features = ["wayland-data-control"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
hickory-resolver = "0.24"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

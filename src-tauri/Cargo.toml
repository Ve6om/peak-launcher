[package]
name = "peak-launcher"
version = "0.1.2"
description = "Peak Launcher - a fast, modern Minecraft launcher"
authors = ["Peak Launcher contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "peak_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "socks"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
